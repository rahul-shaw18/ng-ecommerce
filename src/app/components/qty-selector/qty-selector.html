<div class="flex items-center gap-3">
  <div class="inline-flex items-center">
    <button class="flex items-center" matIconButton [disabled]="quantity() === 1" (click)="qtyUpdated.emit(quantity() - 1)">
      <mat-icon>remove</mat-icon>
    </button>

    <div class="px-3">{{ quantity() }}</div>

    <button class="flex items-center" matIconButton (click)="qtyUpdated.emit(quantity() + 1)">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>

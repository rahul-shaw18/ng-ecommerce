<div class="mx-auto max-w-300 py-6 px-4">
  <app-back-button class="mb-6" label="Continue Shopping" navigateTo="/products/all">
    Continue Shopping
  </app-back-button>

  @if (store.wishlistItems().length > 0) {
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold">My Wishlist</h1>
      <span class="text-gray-500 text-xl">{{ store.wishlistItems().length }} items</span>
    </div>
    <div class="responsive-grid">
      @for (product of store.wishlistItems(); track product.id) {
        <app-product-card [product]="product">
          <button
            class="absolute! z-10 top-3 right-3 shadow-md rounded-md transition-all duration-200 hover:scale-110 hover:shadow-lg"
            matIconButton
            [style.view-transition-name]="'my-wishlist-button-' + product.id"
            (click)="store.removeFromWishlists(product)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </app-product-card>
      }
    </div>

    <div class="mt-8 flex justify-center">
      <button matButton="outlined" class="danger" (click)="store.clearWishlist()">
        Clear Wishlist
      </button>
    </div>
  } @else {
    <app-empty-wishlist />
  }
</div>

<div class="flex items-center gap-8 mb-6 p-4 bg-gray-50 rounded-lg">
  <div class="flex flex-col items-center w-1/2">
    <div class="text-4xl font-bold text-gray-900 mb-1">
      {{ product().rating.toFixed(1) }}
    </div>
    <div>
      <app-star-rating [rating]="product().rating"></app-star-rating>
    </div>

    <div class="text-sm text-gray-500">Based on {{ totalReviews() }} reviews</div>
  </div>

  <div class="flex-1">
    @for (breakdown of ratingBreakdown(); track breakdown.stars) {
      <div class="flex items-center gap-2 mb-2">
        <span class="text-sm flex items-center"
          ><span>{{ breakdown.stars }}</span>
          <mat-icon class=" text-yellow-400!"> star </mat-icon>
        </span>
        <div class="flex-1 h-2 bg-gray-200 rounded-full mx-2">
          <div
            class="h-2 bg-yellow-400 rounded-full transition-all duration-300"
            [style.width.%]="breakdown.percentage"
          ></div>
        </div>
        <span class="text-sm w-8 text-gray-600 text-right">{{ breakdown.count }}</span>
      </div>
    }
  </div>
</div>

<div appViewPanel>
  <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
    <mat-icon>local_shipping</mat-icon>
    Shipping Information
  </h2>

  <form class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <mat-form-field>
      <input matInput type="text" placeholder="First Name" />
    </mat-form-field>

    <mat-form-field>
      <input matInput type="text" placeholder="Last Name" />
    </mat-form-field>

    <mat-form-field class="w-full mb-4 col-span-2">
      <input matInput type="text" placeholder="Address" />
    </mat-form-field>

    <mat-form-field>
      <input matInput type="text" placeholder="City" />
    </mat-form-field>

    <mat-form-field>
      <input matInput type="text" placeholder="State" />
    </mat-form-field>

    <mat-form-field>
      <input matInput type="text" placeholder="Zip Code" />
    </mat-form-field>

    <button type="submit" matButton="filled" class="w-full">Sign In</button>
  </form>
</div>
